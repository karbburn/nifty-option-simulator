name: refresh-data

on:
  schedule:
    - cron: "30 11 * * 1-5"
    # Same-evening catch-up: yfinance sometimes publishes the daily candle
    # well after the 11:30 UTC run, leaving data a session short all weekend.
    - cron: "5 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[web]"
      - run: python -m nifty_gap.data.refresh
      - name: Regenerate dashboard snapshot
        run: python -m nifty_gap.web.snapshot
      - name: Commit updated history + snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/nifty50_history.csv output/dashboard.json output/*.png
          if ! git diff --cached --quiet; then git commit -m "chore(data): refresh nifty50 history + dashboard snapshot" && git push; fi