[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-gap-simulator"
version = "0.1.0"
description = "Weekday-pair gap probability & simulated options backtest for NIFTY 50"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "curl_cffi",
    "yfinance",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
web = ["fastapi", "uvicorn[standard]", "jinja2", "httpx"]

[tool.setuptools.packages.find]
include = ["nifty_gap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100